<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Erkenne den Imposter</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: url('https://cdn.pixabay.com/photo/2020/09/09/14/10/spy-5558476_1280.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-shadow: 1px 1px 2px black;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }
    h1 {
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 10px;
      color: #ffcc00;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
      background: linear-gradient(145deg, #ff4081, #81d4fa);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
    }
    button:hover {
      transform: scale(1.05);
    }
    #roleDisplay {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      min-height: 40px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>🎭 Erkenne den Imposter</h1>
  <div id="hostControls">
    <button onclick="generateRoles()">Neue Runde starten</button>
  </div>
  <div id="playerButtons"></div>
  <div id="roleDisplay"></div>

  <script>
    const begriffPool = [
      "Fußball", "Basketball", "Handball", "Boxen", "Schwimmen", "Tennis", "Laufen", "Skifahren", "Snowboard", "Tischtennis",
      "Badminton", "Judo", "Volleyball", "Eishockey", "Klettern",
      "Trikot", "Ball", "Tor", "Pfeife", "Turnschuhe", "Stoppuhr", "Schweißband", "Hantel", "Goalie", "Schiedsrichter",
      "Zug", "Mütze", "Buch", "Kabel", "Tastatur", "Brille", "Regenschirm", "Apfel", "Zettel", "Rucksack"
    ];

    const spielerNamen = ["Valon", "Denni", "Kujo", "Adri", "Fehmi", "Burak", "Kien"];
    let roles = [];
    let currentVisible = null;

    function generateRoles() {
      const zufallsBegriff = begriffPool[Math.floor(Math.random() * begriffPool.length)];
      roles = Array(6).fill(zufallsBegriff);
      roles.push('IMPOSTER');
      roles = roles.sort(() => Math.random() - 0.5);

      const shuffledNames = [...spielerNamen].sort(() => Math.random() - 0.5);
      const container = document.getElementById('playerButtons');
      container.innerHTML = '';
      document.getElementById('roleDisplay').textContent = '';

      shuffledNames.forEach((name, i) => {
        const btn = document.createElement('button');
        btn.textContent = name;
        btn.onclick = () => {
          if (currentVisible === i) {
            document.getElementById('roleDisplay').textContent = '';
            btn.textContent = name;
            currentVisible = null;
          } else {
            if (currentVisible !== null) {
              const oldBtn = container.children[currentVisible];
              oldBtn.textContent = container.children[currentVisible].getAttribute('data-name');
            }
            btn.textContent = name + ' ✔️';
            btn.setAttribute('data-name', name);
            document.getElementById('roleDisplay').textContent =
              roles[i] === 'IMPOSTER' ? `${name} ist der IMPOSTER!` : `${name}'s Begriff: ${roles[i]}`;
            currentVisible = i;
          }
        };
        btn.setAttribute('data-name', name);
        container.appendChild(btn);
      });
    }
  </script>
</body>
</html>
